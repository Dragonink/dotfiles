hwdec-append=auto
video-sync=display-resample
interpolation=yes

screenshot-dir=~/Pictures/Screenshots/mpv
screenshot-template='%F [%P] (%#02n)'

# mfpbar
osc=no
osd-bar=no

[image]
profile-desc=View image
profile-cond=get('current-tracks/video/image') and not get('current-tracks/video/albumart')
profile-restore=copy
keep-open=yes
video-recenter=yes
