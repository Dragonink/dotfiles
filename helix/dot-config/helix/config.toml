theme = "custom"

[editor]
color-modes = true
popup-border = "all"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.statusline]
left = [
	"mode",
	"position",
	"spacer",
	"selections",
	"register",
]
center = [
	"file-modification-indicator",
	"read-only-indicator",
	"file-name",
]
right = [
	"file-encoding",
	"file-line-ending",
	"file-type",
	"spacer",
	"diagnostics",
	"workspace-diagnostics",
]

[editor.whitespace]
render = "all"
[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
nnbsp = "␣"
tab = "→"
newline = "↲"
[editor.indent-guides]
render = true

[editor.soft-wrap]
enable = true

[keys.normal]
C-q = ":quit-all"
C-s = ":write"
C-w = ":buffer-close"
